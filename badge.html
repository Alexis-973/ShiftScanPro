<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print ID Card</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Screen wrapper ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 20px;
    }

    .screen-hint {
      color: #475569;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Card shell ── */
    /* CR80 = 3.375in × 2.125in  |  at 96dpi = 324 × 204px
       We show 2× on screen (648 × 408px) for a comfortable preview */
    .card-shell {
      position: relative;
      width: 648px;
      height: 408px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.12);
      background: #fff;
    }

    /* ── Left accent panel ── */
    .card-left {
      position: absolute;
      top: 0; left: 0;
      width: 200px;
      height: 100%;
      background: linear-gradient(160deg, #1e3a5f 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 1;
    }

    /* diagonal clip on right edge of left panel */
    .card-left::after {
      content: '';
      position: absolute;
      top: 0; right: -28px;
      width: 56px; height: 100%;
      background: linear-gradient(160deg, #1e3a5f 0%, #0f172a 100%);
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    /* ── Avatar ── */
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #2563eb; /* overridden by JS */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      border: 3px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      position: relative;
      z-index: 2;
    }

    /* ── QR code (left panel, below avatar) ── */
    .qr-wrap {
      background: #fff;
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      position: relative;
      z-index: 2;
    }
    .qr-wrap img {
      display: block;
      width: 72px;
      height: 72px;
    }
    .qr-label {
      color: rgba(255,255,255,0.4);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
      margin-top: 4px;
      position: relative;
      z-index: 2;
    }

    /* ── Right content panel ── */
    .card-right {
      position: absolute;
      top: 0;
      left: 214px; /* 200px panel + 14px overlap buffer */
      right: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 24px 18px 24px;
    }

    /* Company header row */
    .card-company {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .company-name {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #94a3b8;
    }
    .badge-type-pill {
      background: #2563eb;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* Thin divider */
    .divider {
      height: 1px;
      background: linear-gradient(to right, #e2e8f0, transparent);
      margin: 6px 0;
    }

    /* Employee info */
    .emp-name {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .emp-dept {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      margin-top: 6px;
    }
    .emp-line {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 2px;
    }

    /* ID row at bottom */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .id-block {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .id-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
    }
    .id-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.08em;
    }

    /* Accent stripe bottom of card */
    .accent-stripe {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(to right, #1e3a5f, #2563eb, #60a5fa);
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 9px;
      border: none;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-print {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
    }
    .btn-close {
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn:hover { opacity: 0.88; }

    .print-note {
      color: #334155;
      font-size: 0.73rem;
      text-align: center;
      line-height: 1.6;
      max-width: 420px;
    }
    .print-note strong { color: #60a5fa; }

    /* ── PRINT RULES ── */
    @page {
      size: 3.375in 2.125in;
      margin: 0;
    }

    @media print {
      html { width: 3.375in; height: 2.125in; }

      body {
        width: 3.375in !important;
        height: 2.125in !important;
        min-height: unset !important;
        background: transparent !important;
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden;
      }

      .screen-hint,
      .actions,
      .print-note { display: none !important; }

      /* Scale the 2× screen preview down to real CR80 */
      .card-shell {
        width: 3.375in !important;
        height: 2.125in !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      /* Scale everything inside the card by 0.5 (648→324, 408→204 px) */
      .card-shell > * { transform-origin: top left; }

      .card-left  { transform: scale(0.5); transform-origin: top left; }
      .card-right { transform: scale(0.5); transform-origin: top right; }
      .accent-stripe { transform: scale(0.5,1); transform-origin: bottom left; }

      /* Simpler: use zoom on the whole shell content */
      .card-shell {
        zoom: 0.5;
        width: 648px !important;   /* inner content still 648, zoom halves it visually */
        height: 408px !important;
        transform-origin: top left;
      }
      /* Reset the physical container to actual size */
      .card-shell {
        position: relative;
      }
    }
  </style>
</head>
<body>

<div class="screen-hint">Card preview — actual print size: 3.375 × 2.125 in (CR80)</div>

<div class="card-shell">

  <!-- Left dark panel -->
  <div class="card-left">
    <div class="avatar" id="avatar">?</div>
    <div class="qr-wrap">
      <img id="qrImg" src="" alt="QR">
    </div>
    <div class="qr-label">Scan to clock in/out</div>
  </div>

  <!-- Right info panel -->
  <div class="card-right">
    <div>
      <div class="card-company">
        <span class="company-name" id="companyLabel">Production Line Scanner</span>
        <span class="badge-type-pill">Employee</span>
      </div>
      <div class="divider"></div>
    </div>

    <div>
      <div class="emp-name"  id="empName">Loading…</div>
      <div class="emp-dept"  id="empDept"></div>
      <div class="emp-line"  id="empLine"></div>
    </div>

    <div class="card-bottom">
      <div class="id-block">
        <span class="id-label">Employee ID</span>
        <span class="id-value" id="empId">—</span>
      </div>
    </div>
  </div>

  <!-- Bottom accent stripe -->
  <div class="accent-stripe"></div>

</div>

<div class="actions">
  <button class="btn btn-print" onclick="window.print()">🖨 &nbsp;Print to Zebra ZXP</button>
  <button class="btn btn-close" onclick="window.close()">Close</button>
</div>

<div class="print-note">
  In the print dialog → select <strong>Zebra ZXP Series</strong> as printer<br>
  Set paper size to <strong>Card</strong> · Set margins to <strong>None</strong> · Disable headers &amp; footers
</div>

<script>
  const PALETTE = [
    '#2563eb','#7c3aed','#db2777','#d97706',
    '#059669','#dc2626','#0891b2','#65a30d'
  ];

  function pickColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function initials(name) {
    return (name || '?')
      .split(/\s+/).filter(Boolean)
      .map(w => w[0].toUpperCase())
      .slice(0, 2).join('');
  }

  const empId = new URLSearchParams(location.search).get('id');

  if (!empId) {
    document.getElementById('empName').textContent = 'No ID provided';
  } else {
    fetch('/api/employees')
      .then(r => r.json())
      .then(list => {
        const e = list.find(x => x.employee_id === empId);
        if (!e) { document.getElementById('empName').textContent = 'Not found'; return; }

        const av = document.getElementById('avatar');
        av.textContent     = initials(e.name);
        av.style.background = pickColor(e.employee_id);

        document.getElementById('empName').textContent = e.name;
        document.getElementById('empDept').textContent = e.department || '';
        document.getElementById('empLine').textContent = e.line ? '📍 ' + e.line : '';
        document.getElementById('empId').textContent   = e.employee_id;
        document.getElementById('qrImg').src           = `/api/qr/${e.employee_id}`;
      })
      .catch(() => {
        document.getElementById('empName').textContent = 'Could not load employee data';
      });
  }
</script>
</body>
</html>
