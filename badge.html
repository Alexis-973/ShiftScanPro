<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print ID Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px 20px;
    }

    .screen-hint {
      color: #475569;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Card shell — shown 2× on screen for readability, printed at real CR80 size */
    .card-shell {
      width: 648px;
      height: 408px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.65);
    }

    /* ── Left dark panel ── */
    .card-left {
      position: absolute;
      top: 0; left: 0;
      width: 204px; height: 100%;
      background: linear-gradient(155deg, #1e3a5f 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 1;
    }
    /* Diagonal right edge */
    .card-left::after {
      content: '';
      position: absolute;
      top: 0; right: -26px;
      width: 52px; height: 100%;
      background: linear-gradient(155deg, #1e3a5f 0%, #0f172a 100%);
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .avatar {
      width: 86px; height: 86px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.1rem; font-weight: 800; color: #fff;
      border: 3px solid rgba(255,255,255,0.18);
      position: relative; z-index: 2;
    }

    .qr-wrap {
      background: #fff;
      padding: 6px;
      border-radius: 8px;
      position: relative; z-index: 2;
    }
    /* QRCode.js renders a canvas or img inside .qr-wrap */
    .qr-wrap canvas, .qr-wrap img {
      display: block !important;
      width: 74px !important;
      height: 74px !important;
    }

    .qr-label {
      color: rgba(255,255,255,0.38);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      position: relative; z-index: 2;
    }

    /* ── Right info panel ── */
    .card-right {
      position: absolute;
      top: 0; left: 218px; right: 0; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 22px 26px 18px 22px;
    }

    .card-top-row {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .company-label {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: #94a3b8;
    }
    .emp-pill {
      background: #2563eb; color: #fff;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 12px; border-radius: 20px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, #e2e8f0, transparent);
      margin: 7px 0;
    }

    .emp-name {
      font-size: 1.75rem; font-weight: 800;
      color: #0f172a; line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .emp-company {
      font-size: 0.9rem; font-weight: 600;
      color: #334155; margin-top: 7px;
    }

    .card-bottom {
      display: flex; align-items: flex-end;
    }
    .id-block { display: flex; flex-direction: column; gap: 2px; }
    .id-label {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: #94a3b8;
    }
    .id-value {
      font-family: 'Courier New', monospace;
      font-size: 0.95rem; font-weight: 700;
      color: #0f172a; letter-spacing: 0.07em;
    }

    /* Bottom gradient stripe */
    .accent-stripe {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(to right, #1e3a5f, #2563eb, #60a5fa);
    }

    /* ── Buttons ── */
    .actions { display: flex; gap: 12px; }
    .btn {
      padding: 12px 28px; border-radius: 9px; border: none;
      font-size: 0.92rem; font-weight: 600; cursor: pointer;
      letter-spacing: 0.02em;
    }
    .btn-print {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; box-shadow: 0 4px 16px rgba(37,99,235,0.35);
    }
    .btn-close {
      background: rgba(255,255,255,0.06); color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn:hover { opacity: 0.88; }

    .print-note {
      color: #334155; font-size: 0.72rem;
      text-align: center; line-height: 1.7;
    }
    .print-note strong { color: #60a5fa; }

    /* ── PRINT ── */
    @page { size: 3.375in 2.125in; margin: 0; }

    @media print {
      html, body {
        width: 3.375in !important; height: 2.125in !important;
        background: white !important;
        display: block !important; padding: 0 !important;
        margin: 0 !important; min-height: unset !important;
        overflow: hidden;
      }
      .screen-hint, .actions, .print-note { display: none !important; }
      .card-shell {
        border-radius: 0 !important; box-shadow: none !important;
        /* zoom the 648×408px card down to 3.375in×2.125in = 324×204px at 96dpi */
        zoom: 0.5;
        width: 648px !important; height: 408px !important;
      }
    }
  </style>
</head>
<body>

<div class="screen-hint">ID Card Preview — 3.375 × 2.125 in (CR80)</div>

<div class="card-shell">
  <div class="card-left">
    <div class="avatar" id="avatar">?</div>
    <div class="qr-wrap" id="qrWrap"></div>
    <div class="qr-label">Scan to clock in / out</div>
  </div>

  <div class="card-right">
    <div>
      <div class="card-top-row">
        <span class="company-label" id="companyLabel">ShiftScan Pro</span>
        <span class="emp-pill">Employee</span>
      </div>
      <div class="divider"></div>
    </div>
    <div>
      <div class="emp-name"    id="empName">Loading…</div>
      <div class="emp-company" id="empCompany"></div>
    </div>
    <div class="card-bottom">
      <div class="id-block">
        <span class="id-label">Card UID</span>
        <span class="id-value" id="empUid">—</span>
      </div>
    </div>
  </div>

  <div class="accent-stripe"></div>
</div>

<div class="actions">
  <button class="btn btn-print" onclick="window.print()">🖨 &nbsp;Print to Zebra ZXP</button>
  <button class="btn btn-close" onclick="window.close()">Close</button>
</div>

<div class="print-note">
  Print dialog → select <strong>Zebra ZXP Series</strong> as printer<br>
  Paper size: <strong>Card</strong> &nbsp;·&nbsp; Margins: <strong>None</strong> &nbsp;·&nbsp; Disable headers &amp; footers
</div>

<script>
  const PALETTE = [
    '#2563eb','#7c3aed','#db2777','#d97706',
    '#059669','#dc2626','#0891b2','#65a30d'
  ];
  function pickColor(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function initials(name) {
    return (name || '?').split(/\s+/).filter(Boolean)
      .map(w => w[0].toUpperCase()).slice(0, 2).join('');
  }

  const p = new URLSearchParams(location.search);
  const name    = p.get('name')    || 'Unknown';
  const uid     = p.get('uid')     || '';
  const company = p.get('company') || '';
  const eid     = p.get('eid')     || '';

  // Fill card
  document.getElementById('empName').textContent    = name;
  document.getElementById('empCompany').textContent = company;
  document.getElementById('empUid').textContent     = uid || eid;
  if (company) document.getElementById('companyLabel').textContent = company;

  const av = document.getElementById('avatar');
  av.textContent     = initials(name);
  av.style.background = pickColor(eid || name);

  // Generate QR code — encodes the card UID (what the RFID reader sends)
  if (uid || eid) {
    new QRCode(document.getElementById('qrWrap'), {
      text:           uid || eid,
      width:          148,
      height:         148,
      colorDark:      '#000000',
      colorLight:     '#ffffff',
      correctLevel:   QRCode.CorrectLevel.M
    });
  }
</script>
</body>
</html>
